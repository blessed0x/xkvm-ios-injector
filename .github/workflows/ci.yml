name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Style + dead-code gate: gofmt, go vet, staticcheck. Runs the same target
  # the Makefile provides (make lint), so local and CI behavior cannot drift.
  # staticcheck is version-pinned in go.mod via tools.go.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Lint (gofmt + vet + staticcheck)
        run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      # The macos-14/arm64 leg runs the native-toolchain-gated golden tests
      # (TestCyanCheckGoldenExtractedSet et al.); the suite-wide run above is
      # non-verbose, so per-test lines never reach the log. Re-run the golden
      # test with -v here so a PASS/SKIP verdict is visible per push — the
      # proof that the extract -> cgen -> cyan-check cycle actually executed
      # on this runner instead of silently skipping.
      - name: Golden test (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/app/ -run TestCyanCheckGoldenExtractedSet
      # TweakInject golden test against the committed real Shadow deb
      # (testdata/fixtures/debs/). Not native-gated — the whole Convert
      # pipeline is pure Go — so it also runs inside the suite-wide Test
      # step above on both legs; the verbose re-run proves the golden
      # armv7 layout assertions actually executed here.
      - name: TweakInject golden (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run TestTweakInjectGoldenShadow
      # Byte-identical LC_RPATH serializer pin (macos-14 only — builds a
      # synthetic thin armv7 dylib with the iPhoneOS SDK). Same non-verbose
      # gap as the goldens above: re-run with -v so the byte-level rpath
      # assertions (and the 4-mod-8 precondition) are visible per push.
      - name: Rpath byte-identical (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/macho/ -run TestRpathByteIdentical32
      # Pkgmirror install contract (macos-14 only — builds a rootless
      # fixture with the native toolchain). Pins both consumption paths of
      # --pkgmirror: the dpkg-installable .deb (edited control, patched
      # payload) vs the reference snapshot (original control, byte-complete
      # unpatched payload, 0755 modes, no self-nesting). Verbose re-run so
      # the per-test PASS lands in the log.
      - name: Pkgmirror install contract (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run TestPkgmirrorInstallContract
      # AutoPatches .roothidepatch symlink mechanism (macos-14 only —
      # fixture built with the native toolchain). Pins the shipped data.tar
      # symlinks: present for every payload Mach-O in --mode auto, absent
      # for non-Mach-O files, dynamic and default modes, and the pkgmirror
      # snapshot; plus the DEBIAN/*.roothidepatch mirror copy.
      - name: AutoPatches symlinks (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run TestRoothideAutoPatchesSymlinks
      # Hoist var/ collision (macos-14 only — fixture built with the native
      # toolchain). Pins upstream's documented "both /var/jb/var/xxx and
      # /var/xxx" case: jbroot copy wins at the package root, system copy
      # under rootfs/var/, plus the jb-less system var case.
      - name: Hoist var collision (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run TestHoistVarCollision
      # Script + plist fidelity (NOT native-gated — the fixture is plists
      # and a control script only, so it also runs inside the suite-wide
      # Test step on both legs). Pins the plutil-xml1 conversion of every
      # payload plist, the LaunchDaemons/libSandy rewrites, and the
      # DEBIAN/ script walk against the real upstream sed sequence.
      - name: Scripts + plists (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run TestRoothideScriptsAndPlistPatches
      # Fixed-paths warning scope (non-Mach-O half is pure Go, runs on both
      # legs; the Mach-O load-command audit half is toolchain-gated). Pins
      # that the warning covers every walked payload file — text configs
      # and binary assets warn, .png/.strings are excluded, and a missed
      # /var/jb load-command rewrite is surfaced.
      - name: Fixed-paths warning scope (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run 'TestRoothideWarnFixedPathsNonMachO|TestRoothideWarnFixedPathsMachOAudit'
      # Control handling sweep (all pure Go — run on both legs in the
      # suite-wide step; verbose re-run on macos-14 for the log). Pins the
      # .DS_Store cleanup, the blank-line-stripping control round-trip, the
      # iphoneos-arm64 input gate, and the no-var/ hoist case.
      - name: Control handling sweep (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run 'TestRoothideDSStoreCleanup|TestRoothideControlBlankLines|TestRoothideArchGate|TestRoothideHoistNoVar|TestRoothideConflictsMangle'
      # Sandy golden vs real production libSandy profiles (pure Go — also
      # runs in the suite-wide Test step on both legs; verbose re-run for
      # the log). Pins both halves of the dance on real data: the
      # >/rootfs/ rewrite (Safari Plus, including the no-trailing-slash
      # quirk) and the jbroot-strip (AlbumManager's binary rootless
      # profile, whose /var/jb twin must NOT become /rootfs/var/jb).
      # Roothide signing (native toolchain — real Mach-O fixtures built by
      # the host go toolchain, so macos-14 only; also covered by the
      # suite-wide step there). Pins the upstream-matching ldid pass:
      # executables get the roothide platform entitlements merged over any
      # existing ones, non-executables get a plain ad-hoc signature.
      - name: Roothide signing (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run TestRoothideSigning
      - name: Sandy golden real profiles (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run 'TestSandyGoldenRealProfile|TestSandyGoldenRootlessProfile'
      # LaunchDaemons golden vs the real sandyd daemon plists (pure Go —
      # also in the suite-wide step on both legs; verbose re-run for the
      # log). Pins the rootful and rootless variants of the same real
      # daemon: the rootless /var/jb/... program path strips to the root,
      # the rootful /usr/local path is untouched, and no rootfs dance
      # applies to LaunchDaemons.
      - name: LaunchDaemons golden (verbose)
        if: matrix.os == 'macos-14'
        run: go test -race -v ./internal/rootless/ -run TestLaunchDaemonsGoldenReal
      # Generality smoke (macos-14 only, needs go + Xcode for Mach-O
      # fixtures): build ten hermetic fixture IPAs with fully generic names
      # and assert xkvm check's exit code on each — the same sweep that ran
      # against the real downloaded mod IPAs, synthesized so CI needs no
      # external files. Covers clean apps, tier-1 load gaps, tier-2 dlopen
      # gaps, same/cross-family nested dlopen, and the Swift-shim allowlist.
      - name: Generality smoke (10 fixture IPAs)
        if: matrix.os == 'macos-14'
        run: bash scripts/check-smoke.sh
