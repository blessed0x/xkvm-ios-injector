name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Style + dead-code gate: gofmt, go vet, staticcheck. Runs the same target
  # the Makefile provides (make lint), so local and CI behavior cannot drift.
  # staticcheck is version-pinned in go.mod via tools.go.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Lint (gofmt + vet + staticcheck)
        run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
